name: Build and publish Mac preview

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub 预发布标签，例如 mac-preview-v0.1.0"
        required: true
        default: "mac-preview-v0.1.1"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            python_arch: arm64
          - runner: macos-15-intel
            arch: x86_64
            python_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
          architecture: ${{ matrix.python_arch }}
      - name: Install build components
        run: |
          python -m venv .build-venv
          .build-venv/bin/python -m pip install --only-binary=:all: -r InterviewCopilot/requirements-macos.txt -r packaging/macos/requirements-build.txt
          .build-venv/bin/python -c "import platform, tkinter; import CoreAudio, CoreMedia, ScreenCaptureKit, dispatch; assert platform.machine() == '${{ matrix.arch }}'"
      - name: Build and check app
        run: .build-venv/bin/python packaging/macos/build_mac.py --source InterviewCopilot --output mac-dist
      - name: Upload Mac install files
        uses: actions/upload-artifact@v4
        with:
          name: InterviewCopilot-macOS-${{ matrix.arch }}
          path: |
            mac-dist/*.zip
            mac-dist/*.dmg
            mac-dist/*.sha256.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download Mac install files
        uses: actions/download-artifact@v4
        with:
          pattern: InterviewCopilot-macOS-*
          path: release
          merge-multiple: true
      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Release tag may contain only letters, numbers, dot, underscore, and hyphen."
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          适用于 **macOS 15.7 或更新版本**，包含运行环境，无需另装 Python。

          - Apple 芯片（M 系列）：下载 `InterviewCopilot-macOS-arm64.dmg`。
          - Intel 芯片：下载 `InterviewCopilot-macOS-x86_64.dmg`。

          双击 DMG，把“面试伴航.app”拖到“应用程序”。首次打开若提示来源验证，请在确认文件来自本项目后进入“系统设置 → 隐私与安全性 → 仍要打开”。此预览版尚未进行 Apple 开发者签名和公证。

          两种架构均通过自动启动、资源加载、文本导入及原生小窗开关检查。真实音频转写、录制授权及钥匙串写入仍需在使用的 Mac 上验证。请配置自己的 DeepSeek 和语音识别 API，包内不含个人资料或密钥。

          ZIP 为备用分发格式；每个下载文件均附带 SHA-256 校验文件。
          NOTES
          title="面试伴航 Mac 预览版 · macOS 15.7+"
          if gh release view "$RELEASE_TAG" --json isDraft > existing-release.json 2>/dev/null; then
            if [[ "$(python3 -c 'import json; print(json.load(open("existing-release.json"))["isDraft"])')" != "True" ]]; then
              echo "This release is already published. Choose a new release tag."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "$title" --prerelease --notes-file release-notes.md
          fi
          for arch in arm64 x86_64; do
            for extension in dmg zip; do
              asset="release/InterviewCopilot-macOS-${arch}.${extension}"
              test -s "$asset"
              (cd release && sha256sum --check "$(basename "$asset").sha256.txt")
              for file in "$asset" "${asset}.sha256.txt"; do
                uploaded=false
                for attempt in 1 2 3; do
                  if gh release upload "$RELEASE_TAG" "$file" --clobber; then
                    uploaded=true
                    break
                  fi
                  echo "Upload attempt ${attempt} failed for $(basename "$file"); retrying."
                  sleep 5
                done
                if [[ "$uploaded" != true ]]; then exit 1; fi
              done
            done
          done
          # Clean only the known names from our earlier failed, unpublished attempt.
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > uploaded-assets.txt
          while IFS= read -r asset; do
            case "$asset" in
              -Mac-.-arm64.dmg|-Mac-.-arm64.dmg.sha256.txt|-Mac-.-arm64.zip|-Mac-.-arm64.zip.sha256.txt|-Mac-.-x86_64.dmg|-Mac-.-x86_64.dmg.sha256.txt|-Mac-.-x86_64.zip|-Mac-.-x86_64.zip.sha256.txt)
                gh release delete-asset "$RELEASE_TAG" --yes -- "$asset" ;;
            esac
          done < uploaded-assets.txt
          gh release edit "$RELEASE_TAG" --draft=false --target "$GITHUB_SHA" --title "$title" --prerelease --notes-file release-notes.md
